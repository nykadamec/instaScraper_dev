name: ApifyClientTS CI

on:
  push:
    branches: [ main, master ]
    paths:
      - 'packages/apify_ts/**'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'packages/apify_ts/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: packages/apify_ts

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: packages/apify_ts/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Type Check
      run: npm run type-check

    - name: Test
      run: npm test
